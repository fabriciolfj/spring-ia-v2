spring:
  threads:
    virtual:
      enabled: true
  application:
    name: study
  ai:
    anthropic:
      api-key: ${KEY}
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: nomic-embed-text
    typesafe:
      api-key: ${TYPESAFE_API_KEY}
    model:
      chat: anthropic
      embedding: ollama


agent:
  tasks:
    paths: classpath:/agents/*.md
  memory:
    dir: ./test/memory