spring:
  datasource:
    username: root
    password: root
    url: jdbc:postgresql://localhost:5432/mydb
  threads:
    virtual:
      enabled: true
  application:
    name: study
  ai:
    anthropic:
      api-key: ${KEY}
      chat:
        model: claude-opus-5-5
        max-tokens: 4096
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: nomic-embed-text
    typesafe:
      api-key: ${TYPESAFE_API_KEY:0}
    model:
      chat: anthropic
      embedding: ollama



agent:
  tasks:
    paths: classpath:/agents/*.md
  memory:
    dir: ./test/memory